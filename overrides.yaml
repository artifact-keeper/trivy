  - module: golang.org/x/net
    from: v0.58.0
    to: v0.60.0
    severity: HIGH
    advisories:
      - CVE-2026-78669
    summary: >-
      CVE-2026-78669 (HIGH, fixed in golang.org/x/net v0.60.0): denial of
      service in the HTTP/2 implementation via excessive SETTINGS frames. The
      same flaw lives in the standard library's bundled copy of the HTTP/2
      stack and is fixed there by go1.26.9 / go1.27.2, which is why the gate
      lists it twice against this binary (once as x/net, once as stdlib) and
      why this change also raises GO_VERSION. artifact-keeper's Docker
      Publish gate reported it against usr/local/bin/trivy in the
      scanner-adapter image on 2026-10-10 (artifact-keeper run 38087035953),
      blocking every image publish from main. x/net/http2 is linked into the
      binary (`go mod why golang.org/x/net/http2` on the v0.74.0 tree:
      pkg/fanal/image/registry/azure -> Azure SDK azcore/runtime ->
      x/net/http2; grpc's transport links it too). We do not claim to have
      traced an attack path through Trivy; the gate is not reachability-aware
      and the finding is HIGH with a fix.
    vulnerable_range: "< 0.60.0"
    first_patched: 0.60.0
    upstream_status: >-
      NOT bumped upstream. aquasecurity/trivy main and release v0.75.0 both
      pin golang.org/x/net v0.59.0, and no aquasecurity/trivy PR moves it to
      v0.60.0 yet (searched 2026-10-10). v0.60.0 was tagged on 2026-10-08.
      Verified with:
        gh api 'repos/aquasecurity/trivy/contents/go.mod?ref=main' \
          --jq .content | base64 -d | grep 'golang.org/x/net '
        gh pr list -R aquasecurity/trivy --search golang.org/x/net --state all
    policy_exception: >-
      This entry does NOT satisfy policy condition 2 ("upstream has already
      made the same bump"), and is filed anyway. The reasoning, so it can be
      argued with: condition 2 exists so we do not second-guess Aqua's
      judgement about Trivy's dependencies, but the version here is the Go
      team's own security release for this advisory, issued together with
      the toolchain fix this repo already takes without asking Aqua
      (GO_VERSION). The alternative the policy leaves is a suppression in
      artifact-keeper's .trivyignore, whose header forbids exactly that when
      a fixed version can be built against. Every module the bump drags along
      lands on the version upstream release v0.75.0 already ships (the six
      entries below). When upstream makes the bump this exception lapses on
      its own and the entry becomes an ordinary one; update upstream_status
      then. artifact-keeper's backend Dockerfile makes the same exception for
      the same module in its grype and buildctl builds.
    upstream_reference: https://github.com/aquasecurity/trivy/blob/main/go.mod
    advisory_reference: https://nvd.nist.gov/vuln/detail/CVE-2026-78669
    removal_condition: >-
      DELETE this entry, and its six mvs_consequence_of entries, the moment
      TRIVY_VERSION moves to an upstream release whose go.mod pins
      golang.org/x/net >= v0.60.0. Check with:
        git show <tag>:go.mod | grep 'golang.org/x/net '
      apply-overrides.sh fails the build on its own if that happens with this
      entry still here, because `from: v0.58.0` will no longer match.
    expires: 2026-11-10
    filed_by: artifact-keeper platform
    reviewed: 2026-10-10
    expect_linked: true

