# NOTHING WAS ADDED IN ITS PLACE, and that is the substantive point of this
# bump. artifact-keeper's Docker Publish was failing on the scanner-adapter
# with CVE-2026-56864 / CVE-2026-56865 (HIGH) against golang.org/x/mod
