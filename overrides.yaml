# golang.org/x/mod v0.40.0. When a release carries the fix, the correct
# action is to bump TRIVY_VERSION to that release — an override would have
# been an undeclared-divergence-shaped way of doing the same thing, with an
# expiry date to babysit and a second place for the truth to live.
#
# The other half of that publish failure was eight HIGH Go-stdlib findings
# (CVE-2026-33818/-39821/-46600/-56853/-56858/-56859/-56860/-56862) against
