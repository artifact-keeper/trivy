# =============================================================================
# Dependency overrides applied on top of pinned upstream Trivy source.
# =============================================================================
#
# POLICY (see README.md "Override policy"):
#
#   * This is NOT a fork. We build the exact upstream tag named in
#     `trivy_version` and apply only the module bumps listed here.
#   * An override is only justified when ALL of the following hold:
#       1. It fixes a CVE that our own CRITICAL/HIGH fixed-only scan gate
#          flags in the resulting image.
#       2. Upstream has ALREADY made the same bump (on main, or in a merged
#          PR) — we do not get ahead of upstream's own judgement.
#       3. No upstream *release* carries the fix yet.
#   * Every override carries a `removal_condition` and an `expires` date.
#     scripts/apply-overrides.sh FAILS THE BUILD if an override is stale
#     (i.e. the pinned source no longer contains `from`), which is how an
#     override gets noticed and deleted when upstream finally ships it.
#   * Only the modules listed here may change. apply-overrides.sh diffs the
#     resolved module graph before/after and fails the build if `go get`
#     dragged anything else along.
#   * assert-buildinfo.sh then requires each override to be present IN THE
#     COMPILED BINARY at its `to` version. A module that is bumped in the
#     module graph but never linked into the binary is a FAILURE by default,
#     because "not linked" and "successfully upgraded" are very different
#     security claims and only one of them clears a CVE. If a dependency
#     genuinely is unreachable, say so explicitly on the entry:
#
#         expect_linked: false
#         linked_justification: >-
#           How you determined it is not linked, and why the override is
#           still worth carrying.
#
#     Both fields are required together; the script rejects the opt-out
#     without a justification.
#
# Applied with `go get <module>@<to>` (not `-replace`), so the version
# recorded in the binary's Go build info — and therefore in any SBOM or
# `trivy fs` scan of the binary — is the real upgraded version rather than a
# replacement arrow. That is what makes the "did the override take effect?"
# assertion in scripts/verify-image.sh meaningful.

version: 1

# The upstream tag these overrides were reviewed against. apply-overrides.sh
# refuses to run if the Dockerfile's TRIVY_VERSION does not match this — a
# version bump forces a fresh review of every entry below.
trivy_version: v0.74.0

# FOUR ENTRIES, added 2026-09-03 against v0.74.0 and re-reviewed 2026-09-09.
# ONE is the security fix (google.golang.org/grpc); the other three are its
# minimum-version-selection consequences, marked `mvs_consequence_of` and
# deleted with it. The grpc entry's `to` moved v1.83.1 -> v1.83.2 on
# 2026-09-09 for CVE-2026-84445, published against the very version the
# 2026-09-03 entry had moved to; `from` is unchanged because upstream's release
# is unchanged, and the three consequences are unchanged because v1.83.2
# requires the same versions of them as v1.83.1 did.
#
# SEVEN MORE ENTRIES, added 2026-10-10 against v0.74.0: golang.org/x/net
# v0.58.0 -> v0.60.0 for CVE-2026-78669, plus its six minimum-version-selection
# consequences (golang.org/x/crypto, mod, sync, sys, term, text), marked
# `mvs_consequence_of: golang.org/x/net` and deleted with it. The x/net entry
# is a DECLARED EXCEPTION to policy condition 2 and says so in its own
# `policy_exception` field; read that before copying its shape.
#
# Re-reviewed the four grpc entries on the same day, and condition 3 no
# longer holds for them: upstream v0.75.0 (2026-10-01) pins grpc v1.83.2 and
# all three consequences at their `to` versions. The policy answer is to bump
# TRIVY_VERSION to v0.75.0, which retires all four. It is NOT done in this
# change, deliberately: artifact-keeper runs the bundled trivy as a CLIENT of
# its trivy server sidecar (SCANNER_TRIVY_SERVER), and that sidecar is pinned
# at ghcr.io/aquasecurity/trivy:0.74.0 in artifact-keeper's compose files, so
# moving the client a minor ahead of the server needs a coordinated change on
# both sides. v0.75.0's changelog has client/server-mode changes in it
# (aquasecurity/trivy#11141, #11188). That bump is the next change for this
# file; it would also shrink the x/net group below to its one primary entry,
# because v0.75.0 already pins every consequence at its `to` version.
#
# The steady state of this list is EMPTY: an override is a bridge across the
# window between upstream committing a fix and upstream releasing it, and it
# comes down as soon as a release carries the fix. The History section at the
# end of this file is the previous round trip, kept so the next reviewer can
# see the policy working rather than just a list.

overrides:
  - module: google.golang.org/grpc
    from: v1.82.1
    to: v1.83.2
    severity: HIGH
    advisories:
      - CVE-2026-84304
      - GHSA-vp52-pcj8-j9qc
      - CVE-2026-84445
      - GHSA-2v4p-qf9q-27wj
    summary: >-
      Two advisories, one entry. CVE-2026-84304 (fixed in 1.83.1): heap
      memory exhaustion in gRPC-Go's HTTP/2 stack — a peer that fragments
      DATA frames into very small pieces makes the receiver buffer far more
      memory per stream than the flow-control window should permit, so a
      single connection can drive the process out of memory. CVE-2026-84445
      (fixed in 1.82.2 / 1.83.2, published 2026-09-08 against the 1.83.1 this
      entry first moved to): servers built with xds.NewGRPCServer() panic on
      a request carrying neither `:authority` nor `Host`, and the per-RPC
      goroutine does not recover, so the process exits. Trivy runs no gRPC
      server at all in this image, let alone an xDS one, so the second is
      not reachable here in any configuration — but the gate is not
      reachability-aware and the finding is HIGH with a fix, so it blocks the
      publish exactly as the first did. grpc
      enters Trivy's graph indirectly — via the OTLP gRPC exporters
      (go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc,
      .../otlpmetric/otlpmetricgrpc) and the Google Cloud SDKs behind `trivy
      aws` / `trivy cloud` — and is linked into the binary, which is what
      our gobinary-based gate scores. We do not claim to have traced a
      reachable attack path through Trivy itself; the gate is not
      reachability-aware and neither is artifact-keeper's, so the finding
      blocks the publish either way and the fix is a version bump upstream
      has already made.
    vulnerable_range: "< 1.83.2 (CVE-2026-84445: < 1.82.2, >= 1.83.0 < 1.83.2)"
    first_patched: 1.83.2
    upstream_status: >-
      Bumped on aquasecurity/trivy main twice: to v1.83.1 at e000312f
      (aquasecurity/trivy#11176, 2026-09-03) and to v1.83.2 at 8c905373
      (aquasecurity/trivy#11212, 2026-09-09); go.mod on main pins
      google.golang.org/grpc v1.83.2. No upstream release carries either:
      v0.74.0 (2026-08-14, still the latest at time of writing) pins v1.82.1.
      Verified with:
        gh api repos/aquasecurity/trivy/contents/go.mod --jq .content \
          | base64 -d | grep grpc
        gh api repos/aquasecurity/trivy/releases --jq '.[0].tag_name'
    upstream_reference: https://github.com/aquasecurity/trivy/blob/main/go.mod
    advisory_reference: https://github.com/advisories/GHSA-2v4p-qf9q-27wj
    removal_condition: >-
      DELETE this entry the moment we bump TRIVY_VERSION to an upstream
      release whose go.mod pins google.golang.org/grpc >= v1.83.2. Check
      with:
        git show <tag>:go.mod | grep google.golang.org/grpc
      apply-overrides.sh will fail the build on its own if that happens and
      this entry is still here, because `from: v1.82.1` will no longer
      match.
    expires: 2026-11-02
    filed_by: artifact-keeper platform
    reviewed: 2026-09-09
    expect_linked: true

  # Not an independent security fix — see `mvs_consequence_of`.
  - module: github.com/GoogleCloudPlatform/opentelemetry-operations-go/detectors/gcp
    from: v1.32.0
    to: v1.33.0
    severity: NONE
    mvs_consequence_of: google.golang.org/grpc
    advisories:
      - CVE-2026-84304
      - GHSA-vp52-pcj8-j9qc
    summary: >-
      GCP resource detector for OpenTelemetry. THIS MODULE IS NOT ITSELF THE
      SUBJECT OF CVE-2026-84304 and no advisory is claimed against v1.32.0.
      It is declared here because `go get google.golang.org/grpc@v1.83.2`
      moves it: grpc v1.83.2's own go.mod requires v1.33.0 (as v1.83.1's
      did), so
      minimum-version selection raises it and apply-overrides.sh's
      undeclared-change guard correctly refuses to build until the move is
      written down. Declaring it is the honest option; pinning it back is
      not available anyway, because MVS cannot hold a module below what the
      selected grpc requires without a `replace`, which is exactly the
      undeclared divergence this repo refuses. The advisories field carries
      the grpc IDs because this bump exists only to carry that fix — it is
      provenance for the move, not a claim about this module.
    vulnerable_range: "n/a — not a vulnerability fix"
    first_patched: "n/a"
    upstream_status: >-
      Identical on aquasecurity/trivy main, which pins
      github.com/GoogleCloudPlatform/opentelemetry-operations-go/detectors/gcp
      v1.33.0 alongside grpc v1.83.2. This is not our version choice: it is
      the same module graph upstream already resolved when they made the
      bump. No upstream release carries it — v0.74.0 pins v1.32.0. Verified
      with:
        gh api repos/aquasecurity/trivy/contents/go.mod --jq .content \
          | base64 -d | grep -E 'detectors/gcp|go-spiffe|grpc '
    upstream_reference: https://github.com/aquasecurity/trivy/blob/main/go.mod
    removal_condition: >-
      DELETE together with the google.golang.org/grpc entry, at the first
      upstream release whose go.mod pins grpc >= v1.83.2 — that release
      carries these three with it. This entry has no independent life: if
      the grpc override goes, so does this. Check with:
        git show <tag>:go.mod | grep -E 'detectors/gcp|go-spiffe|grpc '
    expires: 2026-11-02
    filed_by: artifact-keeper platform
    reviewed: 2026-09-09
    expect_linked: true

