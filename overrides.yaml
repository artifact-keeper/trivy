# =============================================================================
# Dependency overrides applied on top of pinned upstream Trivy source.
# =============================================================================
#
# POLICY (see README.md "Override policy"):
#
#   * This is NOT a fork. We build the exact upstream tag named in
#     `trivy_version` and apply only the module bumps listed here.
#   * An override is only justified when ALL of the following hold:
#       1. It fixes a CVE that our own CRITICAL/HIGH fixed-only scan gate
#          flags in the resulting image.
#       2. Upstream has ALREADY made the same bump (on main, or in a merged
#          PR) — we do not get ahead of upstream's own judgement.
#       3. No upstream *release* carries the fix yet.
#   * Every override carries a `removal_condition` and an `expires` date.
#     scripts/apply-overrides.sh FAILS THE BUILD if an override is stale
#     (i.e. the pinned source no longer contains `from`), which is how an
#     override gets noticed and deleted when upstream finally ships it.
#   * Only the modules listed here may change. apply-overrides.sh diffs the
#     resolved module graph before/after and fails the build if `go get`
#     dragged anything else along.
#   * assert-buildinfo.sh then requires each override to be present IN THE
#     COMPILED BINARY at its `to` version. A module that is bumped in the
#     module graph but never linked into the binary is a FAILURE by default,
#     because "not linked" and "successfully upgraded" are very different
#     security claims and only one of them clears a CVE. If a dependency
#     genuinely is unreachable, say so explicitly on the entry:
#
#         expect_linked: false
#         linked_justification: >-
#           How you determined it is not linked, and why the override is
#           still worth carrying.
#
#     Both fields are required together; the script rejects the opt-out
#     without a justification.
#
# Applied with `go get <module>@<to>` (not `-replace`), so the version
# recorded in the binary's Go build info — and therefore in any SBOM or
# `trivy fs` scan of the binary — is the real upgraded version rather than a
# replacement arrow. That is what makes the "did the override take effect?"
# assertion in scripts/verify-image.sh meaningful.

version: 1

# The upstream tag these overrides were reviewed against. apply-overrides.sh
# refuses to run if the Dockerfile's TRIVY_VERSION does not match this — a
# version bump forces a fresh review of every entry below.
trivy_version: v0.76.0

# ONE ENTRY, go-jose (added 2026-10-28 for 0.76.0-r3).
#
# FIVE MORE, added 2026-11-09 for 0.76.0-r4: golang.org/x/net v0.60.0 ->
# v0.62.0 for CVE-2026-78661, plus its four minimum-version-selection
# consequences (golang.org/x/crypto, sys, term, text), marked
# `mvs_consequence_of: golang.org/x/net` and deleted with it. The x/net entry
# is a DECLARED EXCEPTION to policy condition 3, the same one the containerd
# entry made for 0.74.0-r5, and says why in its `policy_exception` field.
#
# The steady state is still an empty list: an override exists only to carry
# a fix during the window between upstream committing it and upstream
# releasing it, and when the release lands the entry is deleted and the list
# shrinks back to nothing. apply-overrides.sh handles the empty list
# explicitly ("no overrides declared, building pristine upstream <tag>").
# The History section below records what was here before and why it left.

overrides:
  - module: github.com/go-jose/go-jose/v4
    from: v4.1.5
    to: v4.1.6
    severity: HIGH
    advisories:
      - CVE-2026-116587
      - GHSA-mgcc-cww5-fp2q
    summary: >-
      Go JOSE: denial of service when parsing JWKs that contain RSA keys
      (published 2026-10-27). go-jose enters Trivy's graph indirectly (it is
      `// indirect` in Trivy's go.mod), required by the sigstore modules
      (github.com/sigstore/sigstore, github.com/sigstore/rekor) behind
      attestation and signature handling and by github.com/spiffe/go-spiffe/v2,
      and it is linked into the binary: artifact-keeper's Docker Publish
      Trivy gate flagged it in usr/local/bin/trivy's Go build info in the
      scanner-adapter image (artifact-keeper/artifact-keeper run
      40671050571, 2026-10-28), which is what our gobinary-based gate scores
      too. We do not claim to have traced a reachable attack path through
      Trivy itself; the gate is not reachability-aware and neither is
      artifact-keeper's, so the finding blocks the publish either way and the
      fix is a version bump upstream has already made. go-jose v4.1.6's own
      go.mod has no requirements (go 1.24.0), so `go get` moves nothing else
      and this entry has no mvs_consequence_of companions;
      apply-overrides.sh's undeclared-change guard enforces that.
    vulnerable_range: "<= 4.1.5"
    first_patched: 4.1.6
    upstream_status: >-
      Bumped on aquasecurity/trivy main to v4.1.6 at 8b5ad79c
      (aquasecurity/trivy#11488, merged 2026-10-28); go.mod on main pins
      github.com/go-jose/go-jose/v4 v4.1.6. No upstream release carries it:
      v0.76.0 (the tag we build) and v0.76.1 (the latest release at time of
      writing) both pin v4.1.5. We stay on v0.76.0 rather than move to
      v0.76.1, because v0.76.1 would not clear this advisory and
      artifact-keeper's scanner adapter pairs with a 0.76.0 trivy server in
      client/server mode. Verified with:
        gh api 'repos/aquasecurity/trivy/contents/go.mod?ref=<ref>' \
          --jq .content | base64 -d | grep go-jose
        gh api repos/aquasecurity/trivy/releases --jq '.[0].tag_name'
    upstream_reference: https://github.com/aquasecurity/trivy/pull/11488
    advisory_reference: https://github.com/advisories/GHSA-mgcc-cww5-fp2q
    removal_condition: >-
      DELETE this entry the moment we bump TRIVY_VERSION to an upstream
      release whose go.mod pins github.com/go-jose/go-jose/v4 >= v4.1.6.
      Check with:
        git show <tag>:go.mod | grep go-jose
      apply-overrides.sh will fail the build on its own if that happens and
      this entry is still here, because `from: v4.1.5` will no longer match.
    expires: 2026-12-28
    filed_by: artifact-keeper platform
    reviewed: 2026-10-28
    expect_linked: true

  - module: golang.org/x/net
    from: v0.60.0
    to: v0.62.0
    severity: HIGH
    advisories:
      - CVE-2026-78661
      - GO-2026-6860
    summary: >-
      golang.org/x/net/html: denial of service via crafted HTML input, the
      parser's text-node coalescing (addText, fosterParent) is quadratic in
      the number of short text runs (published 2026-10-27, fixed in v0.62.0,
      every earlier version affected). artifact-keeper's Docker Publish Trivy
      gate flagged it in usr/local/bin/trivy's Go build info in the
      scanner-adapter image at v0.60.0, the version upstream v0.76.0 pins,
      and has failed on main since 2026-11-07 (artifact-keeper run
      42579583951). x/net/html is linked: `go list -deps ./cmd/trivy` on the
      v0.76.0 tree lists it among 14 x/net packages, and its only linked
      importer is golang.org/x/net/html/charset, used by Trivy's Java jar and
      pom parsers and its gradle analyzer. charset only calls
      html.NewTokenizer, and GO-2026-6860 lists html.Parse, ParseFragment and
      their WithOptions variants, so we do not think Trivy runs the
      vulnerable code. The gate is not reachability-aware, so the finding
      blocks the publish either way.
    vulnerable_range: "< 0.62.0"
    first_patched: 0.62.0
    upstream_status: >-
      Bumped upstream AND released: aquasecurity/trivy main pins
      golang.org/x/net v0.62.0 (checked at 10ab0f8, 2026-11-09), and release
      v0.76.2 (2026-11-05) ships it, together with go-jose v4.1.6. v0.76.0
      (the tag we build) and v0.76.1 pin v0.60.0. Verified with:
        git show <tag>:go.mod | grep 'golang.org/x/net '
    policy_exception: >-
      This entry satisfies conditions 1 and 2 but not condition 3 ("no
      upstream release carries the fix"), and is filed anyway, for the
      reason the containerd entry gave for 0.74.0-r5 (see History). v0.76.2
      carries the fix, and the policy answer would be to bump TRIVY_VERSION.
      That cannot be done here in isolation: artifact-keeper's scanner adapter
      (docker/scanner-adapter/remote.go, checkTrivyServer and
      clientModeProvenance) refuses a trivy server whose version differs from
      the bundled client, and the server sidecar is pinned at
      ghcr.io/aquasecurity/trivy:0.76.0 in artifact-keeper's compose files,
      workflows and Helm chart, so a client-only bump breaks every deployment
      that runs the sidecar. The coordinated client+server move to v0.76.2
      retires this entry and the go-jose one together. The alternative the
      policy leaves, a suppression in artifact-keeper's .trivyignore, is
      forbidden by that file's header when a fixed version can be built
      against.
    upstream_reference: https://github.com/aquasecurity/trivy/blob/v0.76.2/go.mod
    advisory_reference: https://pkg.go.dev/vuln/GO-2026-6860
    removal_condition: >-
      DELETE this entry, and its four mvs_consequence_of entries, the moment
      TRIVY_VERSION moves to an upstream release whose go.mod pins
      golang.org/x/net >= v0.62.0 (v0.76.2 already does). Check with:
        git show <tag>:go.mod | grep 'golang.org/x/net '
      apply-overrides.sh fails the build on its own if that happens with this
      entry still here, because `from: v0.60.0` will no longer match.
    expires: 2027-01-09
    filed_by: artifact-keeper platform
    reviewed: 2026-11-09
    expect_linked: true

  # Not an independent security fix, see `mvs_consequence_of`.
  - module: golang.org/x/crypto
    from: v0.57.0
    to: v0.58.0
    severity: NONE
    mvs_consequence_of: golang.org/x/net
    advisories:
      - CVE-2026-78661
    summary: >-
      THIS MODULE IS NOT ITSELF THE SUBJECT OF CVE-2026-78661 and no advisory
      is claimed against v0.57.0 by this entry. It is declared because `go get
      golang.org/x/net@v0.62.0` moves it: x/net v0.62.0's own go.mod requires
      golang.org/x/crypto v0.58.0, so minimum-version selection raises it and
      apply-overrides.sh's undeclared-change guard refuses to build until the
      move is written down. The advisories field carries the x/net ID as
      provenance for the move, not as a claim about this module.
    vulnerable_range: "n/a, not a vulnerability fix"
    first_patched: "n/a"
    upstream_status: >-
      v0.58.0 is exactly what upstream release v0.76.2 (2026-11-05) pins for
      golang.org/x/crypto, so this is the version upstream already chose, not
      ours. v0.76.0 pins v0.57.0. Verified with:
        git show v0.76.2:go.mod | grep 'golang.org/x/'
    upstream_reference: https://github.com/aquasecurity/trivy/blob/v0.76.2/go.mod
    removal_condition: >-
      DELETE together with the golang.org/x/net entry, it has no independent
      life. If TRIVY_VERSION moves to v0.76.2 or later first, this entry goes
      stale on its own (that release already pins v0.58.0) and
      apply-overrides.sh stops the build until it is deleted.
    expires: 2027-01-09
    filed_by: artifact-keeper platform
    reviewed: 2026-11-09
    expect_linked: true

