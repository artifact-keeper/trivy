# version, so this remains a reproduction of upstream's own graph rather than
# a graph of our own invention.

# ---------------------------------------------------------------------------
# History
# ---------------------------------------------------------------------------
#
# What used to be in this list, and why it is not any more. Written at the
# v0.74.0 bump (2026-08-20), when the list went to empty; "here" and "this
# change" below mean that change, not this one.
#
#   oras.land/oras-go/v2 v2.6.1 -> v2.6.2  (CVE-2026-50163,
#   GHSA-fxhp-mv3v-67qp; added 2026-08-06 against v0.73.0). Its
#   removal_condition read: "DELETE this entry the moment we bump
#   TRIVY_VERSION to an upstream release whose go.mod pins
#   oras.land/oras-go/v2 >= v2.6.2." v0.74.0 (2026-08-14) pins v2.6.2, so
#   that condition is met and the entry is deleted here. Had it been left,
#   apply-overrides.sh would have failed the build with "overrides.yaml says
#   upstream pins v2.6.1, but v0.74.0 actually pins v2.6.2" — the staleness
#   guard doing its job.
#
# NOTHING WAS ADDED IN ITS PLACE, and that is the substantive point of this
# bump. artifact-keeper's Docker Publish was failing on the scanner-adapter
# with CVE-2026-56864 / CVE-2026-56865 (HIGH) against golang.org/x/mod
# v0.38.0, fixed in v0.40.0. An override for x/mod would have satisfied
# policy conditions 1 and 2 (our gate flags it; upstream had already bumped
# it on main) but FAILS condition 3: upstream release v0.74.0 already carries
# golang.org/x/mod v0.40.0. When a release carries the fix, the correct
# action is to bump TRIVY_VERSION to that release — an override would have
# been an undeclared-divergence-shaped way of doing the same thing, with an
# expiry date to babysit and a second place for the truth to live.
#
# The other half of that publish failure was eight HIGH Go-stdlib findings
# (CVE-2026-33818/-39821/-46600/-56853/-56858/-56859/-56860/-56862) against
# stdlib v1.26.5. A stdlib CVE has no module to override; it is fixed by the
# toolchain. See GO_VERSION in the Dockerfile, bumped 1.26.5 -> 1.26.7 in the
# same change.

