# =============================================================================
# Dependency overrides applied on top of pinned upstream Trivy source.
# =============================================================================
#
# POLICY (see README.md "Override policy"):
#
#   * This is NOT a fork. We build the exact upstream tag named in
#     `trivy_version` and apply only the module bumps listed here.
#   * An override is only justified when ALL of the following hold:
#       1. It fixes a CVE that our own CRITICAL/HIGH fixed-only scan gate
#          flags in the resulting image.
#       2. Upstream has ALREADY made the same bump (on main, or in a merged
#          PR) — we do not get ahead of upstream's own judgement.
#       3. No upstream *release* carries the fix yet.
#   * Every override carries a `removal_condition` and an `expires` date.
#     scripts/apply-overrides.sh FAILS THE BUILD if an override is stale
#     (i.e. the pinned source no longer contains `from`), which is how an
#     override gets noticed and deleted when upstream finally ships it.
#   * Only the modules listed here may change. apply-overrides.sh diffs the
#     resolved module graph before/after and fails the build if `go get`
#     dragged anything else along.
#   * assert-buildinfo.sh then requires each override to be present IN THE
#     COMPILED BINARY at its `to` version. A module that is bumped in the
#     module graph but never linked into the binary is a FAILURE by default,
#     because "not linked" and "successfully upgraded" are very different
#     security claims and only one of them clears a CVE. If a dependency
#     genuinely is unreachable, say so explicitly on the entry:
#
#         expect_linked: false
#         linked_justification: >-
#           How you determined it is not linked, and why the override is
#           still worth carrying.
#
#     Both fields are required together; the script rejects the opt-out
#     without a justification.
#
# Applied with `go get <module>@<to>` (not `-replace`), so the version
# recorded in the binary's Go build info — and therefore in any SBOM or
# `trivy fs` scan of the binary — is the real upgraded version rather than a
# replacement arrow. That is what makes the "did the override take effect?"
# assertion in scripts/verify-image.sh meaningful.

version: 1

# The upstream tag these overrides were reviewed against. apply-overrides.sh
# refuses to run if the Dockerfile's TRIVY_VERSION does not match this — a
# version bump forces a fresh review of every entry below.
trivy_version: v0.74.0

# ONE ENTRY, added 2026-09-03 against v0.74.0. The steady state of this list
# is EMPTY: an override is a bridge across the window between upstream
# committing a fix and upstream releasing it, and it comes down as soon as a
# release carries the fix. The history at the end of this comment is the
# previous round trip, kept so the next reviewer can see the policy working
# rather than just a list.

overrides:
  - module: google.golang.org/grpc
    from: v1.82.1
    to: v1.83.1
    severity: HIGH
    advisories:
      - CVE-2026-84304
      - GHSA-vp52-pcj8-j9qc
    summary: >-
      Heap memory exhaustion in gRPC-Go's HTTP/2 stack: a peer that fragments
      DATA frames into very small pieces makes the receiver buffer far more
      memory per stream than the flow-control window should permit, so a
      single connection can drive the process out of memory. grpc enters
      Trivy's graph indirectly — via the OTLP gRPC exporters
      (go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc,
      .../otlpmetric/otlpmetricgrpc) and the Google Cloud SDKs behind
      `trivy aws` / `trivy cloud` — and is linked into the binary, which is
      what our gobinary-based gate scores. We do not claim to have traced a
      reachable attack path through Trivy itself; the gate is not
      reachability-aware and neither is artifact-keeper's, so the finding
      blocks the publish either way and the fix is a version bump upstream
      has already made.
    vulnerable_range: "< 1.83.1"
    first_patched: 1.83.1
    upstream_status: >-
      Bumped on aquasecurity/trivy main (go.mod pins google.golang.org/grpc
      v1.83.1). No upstream release carries it: v0.74.0 (2026-08-14, still the
      latest at time of writing) pins v1.82.1. Verified with:
        gh api repos/aquasecurity/trivy/contents/go.mod --jq .content \
          | base64 -d | grep grpc
        gh api repos/aquasecurity/trivy/releases --jq '.[0].tag_name'
    upstream_reference: https://github.com/aquasecurity/trivy/blob/main/go.mod
    advisory_reference: https://github.com/advisories/GHSA-vp52-pcj8-j9qc
    removal_condition: >-
      DELETE this entry the moment we bump TRIVY_VERSION to an upstream
      release whose go.mod pins google.golang.org/grpc >= v1.83.1. Check with:
        git show <tag>:go.mod | grep google.golang.org/grpc
      apply-overrides.sh will fail the build on its own if that happens and
      this entry is still here, because `from: v1.82.1` will no longer match.
    expires: 2026-11-02
    filed_by: artifact-keeper platform
    reviewed: 2026-09-03
    expect_linked: true

# ---------------------------------------------------------------------------
# History
# ---------------------------------------------------------------------------
#
# What used to be in this list, and why it is not any more. Written at the
# v0.74.0 bump (2026-08-20), when the list went to empty; "here" and "this
# change" below mean that change, not this one.
#
#   oras.land/oras-go/v2 v2.6.1 -> v2.6.2  (CVE-2026-50163,
#   GHSA-fxhp-mv3v-67qp; added 2026-08-06 against v0.73.0). Its
#   removal_condition read: "DELETE this entry the moment we bump
#   TRIVY_VERSION to an upstream release whose go.mod pins
#   oras.land/oras-go/v2 >= v2.6.2." v0.74.0 (2026-08-14) pins v2.6.2, so
#   that condition is met and the entry is deleted here. Had it been left,
#   apply-overrides.sh would have failed the build with "overrides.yaml says
#   upstream pins v2.6.1, but v0.74.0 actually pins v2.6.2" — the staleness
#   guard doing its job.
#
# NOTHING WAS ADDED IN ITS PLACE, and that is the substantive point of this
# bump. artifact-keeper's Docker Publish was failing on the scanner-adapter
# with CVE-2026-56864 / CVE-2026-56865 (HIGH) against golang.org/x/mod
# v0.38.0, fixed in v0.40.0. An override for x/mod would have satisfied
# policy conditions 1 and 2 (our gate flags it; upstream had already bumped
# it on main) but FAILS condition 3: upstream release v0.74.0 already carries
# golang.org/x/mod v0.40.0. When a release carries the fix, the correct
# action is to bump TRIVY_VERSION to that release — an override would have
# been an undeclared-divergence-shaped way of doing the same thing, with an
# expiry date to babysit and a second place for the truth to live.
#
# The other half of that publish failure was eight HIGH Go-stdlib findings
# (CVE-2026-33818/-39821/-46600/-56853/-56858/-56859/-56860/-56862) against
# stdlib v1.26.5. A stdlib CVE has no module to override; it is fixed by the
# toolchain. See GO_VERSION in the Dockerfile, bumped 1.26.5 -> 1.26.7 in the
# same change.

